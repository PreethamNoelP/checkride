name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow triggers on pull_request, so it runs code from any fork.
# GitHub already scopes GITHUB_TOKEN to read-only for fork PRs and withholds
# secrets, but inheriting that from a repository setting means the guarantee
# can be changed elsewhere without anyone remembering it applied here.
# Declared at the top level so every job starts from least privilege; a job
# that ever needs more has to say so, visibly, in the diff.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs, not to major tags. A tag is
# a movable label: actions/checkout@v4 is whatever that label points at
# today, so a compromise of the action's repo would reach this workflow on
# its next run with no change here. The trailing comment keeps it readable;
# Dependabot (.github/dependabot.yml) bumps both the SHA and the comment.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: path handling, exclude-glob
        # case sensitivity and encoding detection have all been
        # platform-dependent bugs in this scanner before.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q

  lint:
    # One job, not six: lint and type results do not vary across the OS x
    # version matrix, and mypy is pinned to the 3.11 floor via
    # [tool.mypy] python_version so it checks against the oldest supported
    # interpreter rather than whichever one the runner happens to have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check checkride/ tests/ benchmarks/

      - name: mypy --strict
        # Enforces the py.typed marker the package ships. Without this the
        # marker is an unverified claim, which is exactly the kind of thing
        # checkride exists to complain about in other people's code.
        run: mypy

  dogfood:
    # Four gates, each proving something a test suite alone does not:
    # the shipped package is clean, the clean fixture is not a false
    # positive, the vulnerable fixture is still detected, and the
    # machine-readable outputs actually parse.
    #
    # Every gate that expects a NON-ZERO exit captures it with
    # `&& code=0 || code=$?` and redirects to a file rather than a pipe.
    # GitHub runs `run:` blocks under `bash -e`, so a bare
    # `checkride ...; test $? -eq 1` aborts the step the instant checkride
    # exits 1 -- on precisely the behavior the gate exists to assert.
    # Avoiding pipes keeps these steps correct with or without `pipefail`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Own source is finding-free
        # This gate used to be `checkride . --min-score 100
        # --fail-on-incomplete`, which passed for a reason that was not the
        # one it advertised: checkride's own source contains no sinks, no
        # tool functions and no governance flags, so every category scored
        # "no applicable sites" -> full marks -> 100.0/100. It asserted
        # arithmetic over an empty set, not a clean codebase. Zero sites is
        # INCOMPLETE now, so the honest claim is the one made here -- no
        # findings -- and the "scores 100 against real sites" claim is
        # carried by the clean fixture below, which has 24 of them.
        run: |
          checkride . --json > "$RUNNER_TEMP/self.json" && code=0 || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::self-scan exited $code, expected 0"
            exit 1
          fi
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/self.json"))
          assert r["findings"] == [], r["findings"]
          assert r["skipped"] == [], r["skipped"]
          assert r["total_sites"] == 0, (
              f"checkride's own source now has {r['total_sites']} site(s); "
              "if that is intentional, gate this on --min-score instead"
          )
          PY

      - name: Clean fixture scores 100 against real sites
        run: |
          checkride tests/fixtures/clean_server.py --min-score 100 --fail-on-incomplete
          checkride tests/fixtures/clean_server.py --json > "$RUNNER_TEMP/clean.json"
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/clean.json"))
          # The point of this gate: a 100 that was *earned*. Without this
          # assertion it would pass just as happily on an empty file.
          assert r["total_sites"] > 0, r["total_sites"]
          assert r["verdict"] == "PASS", r["verdict"]
          assert r["findings"] == [], r["findings"]
          PY

      - name: A scan that recognized nothing cannot report PASS
        # The regression gate for the vacuous-pass hole. An empty-ish repo
        # under the strictest flags must be INCOMPLETE and exit 1.
        run: |
          mkdir -p "$RUNNER_TEMP/nosites"
          printf 'def add(a, b):\n    return a + b\n' > "$RUNNER_TEMP/nosites/util.py"
          checkride "$RUNNER_TEMP/nosites" --min-score 100 --fail-on-incomplete \
            && code=0 || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::zero-site scan exited $code, expected 1 -- the vacuous-pass hole is back"
            exit 1
          fi
          checkride "$RUNNER_TEMP/nosites" --scope all --min-score 100 --fail-on-incomplete \
            && code=0 || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::zero-site scan exited $code, expected 1 -- the vacuous-pass hole is back"
            exit 1
          fi

      - name: Vulnerable fixture is still detected
        # The regression gate that matters: if detection silently breaks,
        # checkride exits 0 here and the build must fail.
        run: |
          checkride tests/fixtures/vulnerable_server.py && code=0 || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::vulnerable fixture exited $code, expected 1 -- detection regressed"
            exit 1
          fi
          checkride tests/fixtures/vulnerable_server.py --json > "$RUNNER_TEMP/vuln.json" && code=0 || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::--json run exited $code, expected 1"
            exit 1
          fi
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/vuln.json"))
          assert r["verdict"] == "FAIL_CRITICAL", r["verdict"]
          assert r["score"] == 0.0, r["score"]
          PY

      - name: JSON and SARIF output are well-formed
        run: |
          checkride . --json > "$RUNNER_TEMP/report.json"
          checkride . --sarif > "$RUNNER_TEMP/report.sarif"
          python - <<'PY'
          import json, os
          json.load(open(os.environ["RUNNER_TEMP"] + "/report.json"))
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/report.sarif"))
          assert d["version"] == "2.1.0"
          assert d["runs"][0]["tool"]["driver"]["version"]
          assert "invocations" in d["runs"][0]
          PY

      - name: Scanning a hostile repository does not crash
        # Untrusted input is the normal case for this tool. The files are
        # written from Python so the NUL byte and the bogus PEP 263 coding
        # declaration are exact bytes, not shell-quoting guesswork.
        run: |
          python - <<'PY'
          import os, pathlib
          d = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hostile"
          d.mkdir(exist_ok=True)
          (d / "syntax.py").write_text("def broken(:\n")
          (d / "nul.py").write_bytes(b"x = '\x00'\n")
          (d / "enc.py").write_bytes(b"# -*- coding: nope -*-\nx = 1\n")
          (d / "real.py").write_text(
              "import shutil\n@mcp.tool()\ndef wipe(p):\n    shutil.rmtree(p)\n"
          )
          PY
          checkride "$RUNNER_TEMP/hostile" --json > "$RUNNER_TEMP/hostile.json" && code=0 || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::hostile scan exited $code, expected 1"
            exit 1
          fi
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/hostile.json"))
          assert len(r["skipped"]) == 3, r["skipped"]
          assert r["verdict"] == "FAIL_CRITICAL", r["verdict"]
          PY

  benchmark:
    # The labelled corpus is the accuracy record: precision and recall are
    # printed into the job summary, and any difference from the labels --
    # a regression, or an improvement nobody recorded -- fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Corpus matches its labels
        run: |
          python benchmarks/run.py
          python benchmarks/run.py --markdown >> "$GITHUB_STEP_SUMMARY"

  package:
    # What a user installs is the wheel, not the checkout. Build it, install
    # it into a clean virtualenv with nothing else, and run it there: a
    # missing package, an unlisted module or a broken entry point fails here
    # rather than on someone else's CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/checkride" --version
          "$RUNNER_TEMP/venv/bin/checkride" "$GITHUB_WORKSPACE/tests/fixtures/clean_server.py" --min-score 100 --fail-on-incomplete
          "$RUNNER_TEMP/venv/bin/checkride" "$GITHUB_WORKSPACE/tests/fixtures/vulnerable_server.py" && code=0 || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::installed wheel exited $code on the vulnerable fixture, expected 1"
            exit 1
          fi
          "$RUNNER_TEMP/venv/bin/pip" show checkride | grep -i '^Requires: *$'

