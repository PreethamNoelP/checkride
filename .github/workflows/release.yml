name: Release

# Publishes to PyPI when a GitHub Release is published -- never on a plain
# push or tag. Uses PyPI trusted publishing (OIDC): no API token or password
# is stored anywhere; PyPI trusts this exact workflow file in this exact
# repository, and only from the "pypi" environment.
#
# One-time setup, done on PyPI and GitHub by the maintainer:
#   1. PyPI -> Your account -> Publishing -> add a pending trusted publisher:
#        project checkride, owner PreethamNoelP, repository checkride,
#        workflow release.yml, environment pypi
#   2. GitHub -> Settings -> Environments -> New environment "pypi"
#      (optionally require a reviewer, so every publish needs a click)
# Then: bump checkride/__init__.py, tag vX.Y.Z, and publish a GitHub
# Release for that tag.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        # A release tagged v0.3.0 must not upload a package that says 0.2.0;
        # PyPI versions are permanent and cannot be re-uploaded.
        run: |
          version=$(python -c "import checkride; print(checkride.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Test suite
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -q
          python benchmarks/run.py

      - name: Build and check
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/checkride/
    permissions:
      id-token: write  # the OIDC token PyPI trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
