name: checkride
description: Static governance scan for MCP servers and AI agent tool-calling code.
author: Preetham Noel P

branding:
  icon: shield
  color: green

inputs:
  path:
    description: File or directory to scan.
    required: false
    default: "."
  min-score:
    description: >-
      The score a PASS needs; below it the verdict is FAIL_SCORE and the
      step fails. Left empty, [tool.checkride] min_score applies, which
      defaults to 70. "0" disables the score floor.
    required: false
    default: ""
  scope:
    description: >-
      "tools" (default) judges only code reachable from a recognized tool
      entry point; "all" treats every function with a sensitive action as
      a tool. Left empty, [tool.checkride] scope applies.
    required: false
    default: ""
  fail-on-incomplete:
    description: >-
      Fail on an INCOMPLETE verdict: a file that could not be parsed, a
      disabled critical-gate rule, no recognized tool entry point, or a scan
      that found zero applicable sites and therefore proved nothing.
    required: false
    default: "false"
  sarif-file:
    description: >-
      Write a SARIF 2.1.0 report here instead of human-readable output, for
      github/codeql-action/upload-sarif. The step still exits with the
      governance exit code, so one run both reports and gates.
    required: false
    default: ""
  config:
    description: Explicit TOML config path, instead of pyproject.toml discovery.
    required: false
    default: ""
  no-config:
    description: >-
      Ignore the scanned repository's own pyproject.toml and use the built-in
      defaults. Set this to "true" when the code under scan is not fully
      trusted -- a pull request from a fork can edit [tool.checkride] in the
      same change it is judged by, excluding files or accepting risks.
      Cannot be combined with `config`.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install checkride
      shell: bash
      # Installed from the action's own checkout ($GITHUB_ACTION_PATH), not
      # from PyPI or a git URL: the version of checkride that runs is exactly
      # the ref the caller pinned with `uses:`. checkride has no runtime
      # dependencies; the one thing fetched from PyPI is the build backend,
      # and pyproject.toml pins it to an exact version.
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Run checkride
      shell: bash
      env:
        AG_PATH: ${{ inputs.path }}
        AG_MIN_SCORE: ${{ inputs.min-score }}
        AG_SCOPE: ${{ inputs.scope }}
        AG_FAIL_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
        AG_SARIF: ${{ inputs.sarif-file }}
        AG_CONFIG: ${{ inputs.config }}
        AG_NO_CONFIG: ${{ inputs.no-config }}
      # The path goes last, after `--`, so an input that begins with a dash
      # is a (missing) file name and never an option.
      #
      # Inputs are passed as environment variables and appended with `+=`
      # rather than interpolated into the script body: `${{ }}` expansion
      # happens before bash sees the line, so an input containing quotes or
      # a semicolon would otherwise be able to inject shell commands into a
      # workflow that merely used this action.
      run: |
        args=()
        # Written as `if` blocks rather than `[ -n "$X" ] && args+=(...)`:
        # under `bash -e` the shorthand's exit status is the failed test
        # whenever the input is empty, which is a documented foot-gun this
        # repo has already been bitten by once (see the dogfood job).
        if [ -n "$AG_MIN_SCORE" ]; then
          args+=(--min-score "$AG_MIN_SCORE")
        fi
        if [ -n "$AG_SCOPE" ]; then
          args+=(--scope "$AG_SCOPE")
        fi
        if [ "$AG_FAIL_INCOMPLETE" = "true" ]; then
          args+=(--fail-on-incomplete)
        fi
        if [ -n "$AG_CONFIG" ]; then
          args+=(--config "$AG_CONFIG")
        fi
        if [ "$AG_NO_CONFIG" = "true" ]; then
          args+=(--no-config)
        fi

        if [ -n "$AG_SARIF" ]; then
          mkdir -p "$(dirname "$AG_SARIF")"
          # Redirect, never a pipe: `run:` executes under `bash -e`, so a
          # pipeline would abort the step on checkride's own non-zero
          # governance exit before the code could be inspected.
          checkride "${args[@]}" --sarif -- "$AG_PATH" > "$AG_SARIF" && code=0 || code=$?
        else
          checkride "${args[@]}" -- "$AG_PATH" && code=0 || code=$?
        fi
        exit "$code"
